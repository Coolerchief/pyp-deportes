name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The repository is public: fail if any commit in the history (a PR brings its own commits)
  # carries a key, password, token or connection string. Uses the pinned gitleaks release
  # binary, checked against its published SHA-256, instead of an action that needs a license.
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file"             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$file" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the git history
        run: $RUNNER_TEMP/gitleaks git --redact --no-banner --verbose .

  # Lint, typecheck, unit tests, static build and Playwright against apps/web/out.
  web:
    name: web (lint, test, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # CI has no database: the build reads the snapshot of pyp-dev's public views (T2.1).
      - name: Build
        env:
          BUILD_DATA_FILE: fixtures/build-data.json
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @pyp/web exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  # pgTAP tests (supabase/tests) against a throwaway Postgres inside the runner: it applies
  # supabase/migrations and supabase/seeds from this commit. Never touches pyp-dev or production,
  # so it needs no secrets.
  db:
    name: db (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start Postgres with migrations and seed
        run: supabase db start

      - name: Run pgTAP tests
        run: supabase test db

      # Security test 8 (concurrent next_folio) needs several connections: plain Node + pg.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Concurrent folio test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/folio-concurrency.mjs
