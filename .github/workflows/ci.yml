name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # pgTAP tests (supabase/tests) against a throwaway Postgres inside the runner: it applies
  # supabase/migrations and seed.sql from this commit. Never touches pyp-dev or production,
  # so it needs no secrets. Lint, typecheck, unit tests and build are added in T0.6.
  db:
    name: db (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start Postgres with migrations and seed
        run: supabase db start

      - name: Run pgTAP tests
        run: supabase test db
